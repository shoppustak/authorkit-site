<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthorKit — Professional Tools for Self-Publishing Authors</title>
    <meta name="description" content="AuthorKit provides powerful WordPress tools for authors to manage books, reviews, and audiences. We are currently undergoing a major rebrand and upgrade.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: hsl(0, 0%, 98%);
            --text-primary: hsl(0, 0%, 10%);
            --text-secondary: hsl(0, 0%, 40%);
            --accent-color: hsl(158, 64%, 30%); /* Subtle emerald green for authorkit */
            --border-color: hsl(0, 0%, 85%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Source Serif 4', serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            animation: fadeIn 1s ease-out forwards;
            opacity: 0;
        }

        .badge {
            display: inline-block;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        h1 i {
            font-style: italic;
            font-weight: 400;
            color: var(--accent-color);
        }

        p.description {
            font-size: clamp(1.125rem, 2vw, 1.25rem);
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 3rem;
            line-height: 1.7;
        }

        .cta-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--text-primary);
            color: var(--bg-color);
            padding: 0.875rem 2rem;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 4px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            background-color: hsl(0, 0%, 20%);
        }

        .contact-link {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .contact-link:hover {
            color: var(--text-primary);
        }

        .footer {
            position: absolute;
            bottom: 2rem;
            width: 100%;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 1.5rem;
            }
            .badge {
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">Site Update in Progress</div>
        <h1>Something <i>beautiful</i> is coming.</h1>
        <p class="description">
            We are currently upgrading AuthorKit to bring you a more powerful suite of WordPress tools designed specifically for self-publishing authors.
        </p>
        
        <div class="cta-container">
            <a href="mailto:support@authorkit.pro" class="cta-button">Contact Support</a>
            <a href="https://docs.authorkit.pro" class="contact-link">Read the Documentation →</a>
        </div>
    </div>

    <div class="footer">
        &copy; <span id="year"></span> AuthorKit. All rights reserved.
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
